<svg xmlns="http://www.w3.org/2000/svg" viewBox="-29.5 0 452 452" width="452" height="452" fill="none">
  <!--
    Dexena-Signet aus files/favicon dark.svg + files/favicon white.svg.
    Beide Vorlagen unterscheiden sich nur in den Füllfarben der ersten drei
    Pfade, deshalb hier EINE Datei: Standard = dunkle Fassung (helle
    Browserleiste), unter prefers-color-scheme: dark die helle Fassung.
    Der orange Punkt ist in beiden Fassungen identisch.
    viewBox nach links verschoben, damit das 393 breite Motiv in einem
    quadratischen Icon-Feld zentriert steht.
  -->
  <style>
    .ring { fill: #342854; }
    .stem { fill: #A789F2; }
    .bow  { fill: #855CED; }
    @media (prefers-color-scheme: dark) {
      .ring { fill: #FFFFFF; }
      .stem { fill: #CDB9FF; }
      .bow  { fill: #A789F2; }
    }
  </style>
