  <path class="stem" d="M250.864 0C278.573 1.21123e-06 301.036 22.4631 301.036 50.1727V301.036C301.036 235.5 259.152 179.746 200.691 159.083V50.1727C200.691 22.4631 223.154 -1.21123e-06 250.864 0Z"/>
  <path class="bow" d="M200.691 159.083C258.695 179.585 300.381 234.631 301.028 299.503L301.036 301.036C301.036 328.746 278.573 351.209 250.864 351.209C223.154 351.209 200.691 328.746 200.691 301.036V159.083Z"/>
  <circle cx="342.835" cy="401.382" r="50.1727" fill="#FF7049"/>
</svg>
